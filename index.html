<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="CascadingStyleSheet.css">
</head>

<body style="background-color: wheat;">


  <div class="implement">
    <h1>Sign Up</h1>

    <form>
      <label>Name</label>
      <input type="text" placeholder="Enter your name" class="width" id="separate1" />
      <label>Email</label>
      <input type="text" placeholder="Enter your email" class="width" id="separate2" />
      <label>Password</label>
      <input type="password" placeholder="Enter your password" class="width" id="separate3" />
      <label>Confirm Password</label>
      <input type="password" placeholder="Enter your confirm password" class="width" id="separate4" />
      <label>Enter your hobbies</label>
      <input type="checkbox" name="sports" value="cricket" class="same"  id="separate5"/>Cricket
      <input type="checkbox" name="sports" value="football"  class="same" id="separate6" />Football
      <input type="checkbox" name="sports" value="tennis ball" class="same" id="separate7"/>Tennis ball

      <button type="submit" id="coloring">Submit</button>
    </form>
  </div>

  <script src="firstday.js"></script>



</body>

</html>
